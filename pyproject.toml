[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-xdna"
version = "0.1.0.dev0"
description = "Self-contained Linux XDNA detector sidecar for unmodified Frigate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Manager runtime (Task 02): narrow, pinned operational dependencies only.
dependencies = [
    "requests==2.34.2",
    "onnx==1.23.0",
]

[project.scripts]
fxdna = "frigate_xdna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
