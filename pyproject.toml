[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frigate-xdna"
version = "0.1.0.dev0"
description = "Self-contained Linux XDNA detector sidecar for unmodified Frigate"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Manager runtime stays stdlib-only in v0.1 foundation; pinned operational
# dependencies (pyzmq, requests, ...) are added by later tasks with lockfile
# entries. No dependencies declared yet on purpose.
dependencies = []

[project.scripts]
fxdna = "frigate_xdna.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
