# CodeRabbit review gating.
#
# Auto-review is disabled: reviews are requested explicitly by the
# terminal `coderabbit` CI job (build.yml), which runs only after the
# hardware-free tests and Sonar analysis are green. This keeps review
# findings stable — no incremental re-reviews triggered by fix pushes
# mid-review — and avoids the opt-in-label state problem (a positive
# label would re-enable automatic incremental reviews while present).
# Manual `@coderabbitai review` comments still work at any time.
reviews:
  auto_review:
    enabled: false
