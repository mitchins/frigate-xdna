# Plus overlay: Frigate+ model acquisition for the xdna sidecar.
# Local-only/offline deployments must NOT include this file, so no Plus
# credential is required unless Plus models are actually used.
# Usage: docker compose -f compose.yaml -f compose.plus.yaml up -d xdna
# Reuse the same Plus key already configured for Frigate itself.
services:
  xdna:
    environment:
      PLUS_API_KEY: "${PLUS_API_KEY:?Set PLUS_API_KEY to the Frigate+ API key}"
