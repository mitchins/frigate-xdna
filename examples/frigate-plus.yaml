# Merge into stock Frigate 0.18.0. Not a complete camera configuration.
# Start/prepare the same model in the sidecar BEFORE reinitializing this detector.
# Frigate still needs its own normal Plus API key to retrieve its model/metadata.
detectors:
  xdna:
    type: zmq
    endpoint: tcp://xdna:5555
    request_timeout_ms: 200
    linger_ms: 0
model:
  path: plus://REPLACE_WITH_YOUR_MODEL_ID
# Do not replace Plus metadata with a generic COCO label map.
