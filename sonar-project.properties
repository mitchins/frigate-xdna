# SonarCloud analysis scope — Frigate-XDNA (Task 8.3.5).
# Every exclusion below is intentional and documented; see docs/HARDENING.md §1.
# Real runtime/compiler/native product code is NOT excluded to hide findings.

sonar.projectKey=mitchins_frigate-xdna
sonar.organization=mitchins
sonar.host.url=https://sonarcloud.io

sonar.projectName=frigate-xdna
sonar.sourceEncoding=UTF-8

# First-party product + build code under analysis.
sonar.sources=src,native/src,recipes,tools,packaging,schemas
sonar.tests=tests

# --- Full-analysis exclusions (all scans) ---
# native/reference/** : byte-identical Phase-5/Phase-7 proof sources kept for
#   provenance (native/reference/README.md). NOT compiled: native/CMakeLists.txt
#   builds only native/src/*.cpp. NOT shipped. Must not be modified (would
#   destroy provenance), so maintainability findings there are unactionable.
# tests/upstream/** : pinned stock Frigate v0.18.0-rc2 sources used ONLY by
#   contract tests (tests/upstream/LICENSE, NOTICES.md). Third-party code that
#   must not be modified to satisfy our linters.
# packaging/vendor-input/** : staged audited binary payload input + public COCO
#   calibration images (build input, gitignored except calib assets); not code.
# packaging/vendor-files.manifest.json : GENERATED by tools/build_vendor_manifest.py.
# **/__pycache__/** : bytecode, never source.
sonar.exclusions=native/reference/**,tests/upstream/**,packaging/vendor-input/**,packaging/vendor-files.manifest.json,**/__pycache__/**

# --- Coverage exclusions (NOT quality waivers; rationale in docs/HARDENING.md §4) ---
# native/** : C++ paths are exercised by contract/hardware tests, not by
#   Python line coverage. Do not fake Python-style numbers for them.
# tools/**, recipes/** : operator-run offline scripts (compile/prepare/validate,
#   manifest builders, one-shot import). Verified by execution/smoke in the
#   appliance build, not by import coverage.
# src/frigate_xdna/__main__.py : 3-line entry shim; real paths covered via cli tests.
sonar.coverage.exclusions=native/**,tools/**,recipes/**,src/frigate_xdna/__main__.py
sonar.python.coverage.reportPaths=coverage.xml

# --- Duplication exclusions ---
# tests/fixtures/** : binary/text evidence fixtures (raw tensors, labelmap).
sonar.cpd.exclusions=tests/fixtures/**
