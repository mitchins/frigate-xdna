# Release — Frigate-XDNA appliance (Task 8.5, B2-backed).
#
# GitHub-hosted runners only. No self-hosted runners, no NPU tests here
# (no device needed to build); no vendor payload, private model, or
# credential ever enters artifacts, caches or releases.
#
# The audited vendor payload lives as a content-pinned tarball in a
# PRIVATE Backblaze B2 bucket (see packaging/vendor-bundle.json). The
# job downloads it by the exact filename derived from the in-tree
# manifest, verifies its sha256 against the committed receipt, then
# verifies every file with verify_payload before building.
#
# Single publication trigger: a pushed v* tag publishes. Manual dispatch
# is dry-run only by construction (it cannot publish, so a requested
# version can never diverge from the built SHA). No `release: published`
# trigger: one version builds exactly once; the workflow itself creates
# the GitHub Release and attaches SBOM + manifest afterwards.
#
# Flow: approved manual release
#   -> verify pinned inputs (tag SHA, B2 bundle bytes, manifests)
#   -> pinned, auditable docker build (linux/amd64, packaging/Dockerfile)
#   -> SBOM + release manifest + base inventory from release inputs
#   -> push pinned tags to GHCR -> attest (OIDC) -> pull-by-digest sanity
#   -> create GitHub Release (prerelease for RCs) with SBOM + manifest
#
# First use requires the owner to (see docs/RELEASE.md):
#   1. keep B2_APP_KEY (secret) + B2_KEY_ID (variable) set,
#   2. create the protected `release` environment (owner approval).
name: Release
on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version to dry-run build (e.g. v0.1.0-rc.1). Dispatch never publishes."
        required: false
        default: "v0.1.0-rc.1"
  push:
    tags:
      - "v*"

# Least privilege; jobs add only what they use.
permissions:
  contents: read

# A release must never be cancelled or overlapped mid-push.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mitchins/frigate-xdna

jobs:
  release-build:
    name: Verify, build, SBOM, push, attest
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: release
    # Publish needs packages:write, attestations need id-token/attestations.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.tags.outputs.version }}
      stable: ${{ steps.tags.outputs.stable }}
      pushed: ${{ steps.push.outputs.pushed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          # The exact requested tag/SHA, never main-by-default.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Record source SHA
        id: source
        run: |
          set -eu
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git status --short | head -5
          test -z "$(git status --short)" || {
            echo "refusing release from a dirty tree"; exit 1; }

      - name: Resolve version and tags
        id: tags
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.version_tag }}"
          fi
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*-rc.[0-9]*) STABLE=false ;;
            v[0-9]*.[0-9]*.[0-9]*) STABLE=true ;;
            *) echo "refusing malformed version tag: $TAG"; exit 1 ;;
          esac
          VER="${TAG#v}"
          if ! printf '%s' "$VER" | grep -qE \
            '^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "refusing malformed version: $VER"; exit 1
          fi
          SHORT="$(git rev-parse --short HEAD)"
          if [ "$STABLE" = "true" ]; then
            # shellcheck disable=SC2086
            TAGS="$VER ${VER%.*} ${VER%%.*} latest sha-$SHORT"
          else
            TAGS="$VER sha-$SHORT"
          fi
          # Manual dispatch can only dry-run; only a real pushed tag
          # publishes, so the version can never diverge from the SHA.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            PUSH=false
          else
            PUSH=true
          fi
          {
            echo "tag=$TAG"
            echo "version=$VER"
            echo "stable=$STABLE"
            echo "push=$PUSH"
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tag=$TAG stable=$STABLE push=$PUSH tags=[$TAGS]"

      - name: Fetch audited vendor bundle from private B2 (fail-closed)
        env:
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_KEY_ID: ${{ vars.B2_KEY_ID }}
        run: |
          set -eu
          test -n "${B2_APP_KEY:-}" || {
            echo "refusing release: B2_APP_KEY secret is not set"; exit 1; }
          test -n "${B2_KEY_ID:-}" || {
            echo "refusing release: B2_KEY_ID variable is not set"; exit 1; }
          pip install --quiet --user b2==5.0.0
          export PATH="$HOME/.local/bin:$PATH"
          MANIFEST_SHA="$(sha256sum packaging/vendor-files.manifest.json | cut -d" " -f1)"
          BUNDLE="vendor-input-${MANIFEST_SHA:0:12}.tar.xz"
          RECEIPT_BUNDLE="$(python3 -c "import json; print(json.load(open('packaging/vendor-bundle.json'))['bundle'])")"
          test "$BUNDLE" = "$RECEIPT_BUNDLE" || {
            echo "receipt names $RECEIPT_BUNDLE but tree pins $BUNDLE"; exit 1; }
          RECEIPT_SHA="$(python3 -c "import json; print(json.load(open('packaging/vendor-bundle.json'))['sha256'])")"
          BUCKET="$(python3 -c "import json; print(json.load(open('packaging/vendor-bundle.json'))['bucket'])")"
          b2 account authorize "$B2_KEY_ID" "$B2_APP_KEY" > /dev/null
          b2 file download "b2://$BUCKET/$BUNDLE" /tmp/vendor-bundle.tar.xz
          echo "$RECEIPT_SHA  /tmp/vendor-bundle.tar.xz" | sha256sum -c -
          rm -rf packaging/vendor-input
          mkdir -p packaging/vendor-input
          tar -xJf /tmp/vendor-bundle.tar.xz -C packaging/
          rm -f /tmp/vendor-bundle.tar.xz

      - name: Verify vendor payload against manifests (fail-closed)
        run: |
          set -eu
          python3 packaging/verify_payload.py \
            --manifest packaging/vendor-files.manifest.json \
            --payload packaging/vendor-input/compile-site-packages \
            --xrt packaging/vendor-input/xrt \
            --flexmlrt packaging/vendor-input/flexmlrt \
            --calib packaging/vendor-input/calib \
            --legal packaging/vendor-input/legal
          python3 - <<'EOF'
          import hashlib
          import json
          manifest = json.load(open("packaging/vendor-files.manifest.json"))
          lock = json.load(open("packaging/vendor.lock.json"))
          by_key = {}
          for e in manifest["files"]:
              by_key.setdefault(
                  (e["package"], e["version"], e["licence"]), []).append(
                      e["sha256"])
          for comp in lock["components"]:
              key = (comp["package"], comp["version"], comp["licence"])
              want = hashlib.sha256(
                  "\n".join(sorted(by_key.get(key, []))).encode()
              ).hexdigest()
              assert comp["files_sha256"] == want, (
                  f"vendor.lock drift for {key[0]}@{key[1]}: "
                  "lock does not match the audited manifest")
              assert comp["file_count"] == len(by_key.get(key, [])), (
                  f"vendor.lock file_count drift for {key[0]}")
          print(f"vendor.lock verified: {len(lock['components'])} components")
          EOF

      - name: Build appliance (linux/amd64, pinned inputs)
        run: |
          set -eu
          mkdir -p release-out
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "CREATED=$CREATED" >> "$GITHUB_ENV"
          # shellcheck disable=SC2086
          docker buildx build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/mitchins/frigate-xdna" \
            --label "org.opencontainers.image.revision=${{ steps.source.outputs.sha }}" \
            --label "org.opencontainers.image.version=${{ steps.tags.outputs.version }}" \
            --label "org.opencontainers.image.created=$CREATED" \
            --label "org.opencontainers.image.licenses=MIT for project source; incorporated AMD/vendor binaries under AMD-EULA and third-party terms, see /opt/fxdna/legal" \
            -f packaging/Dockerfile \
            -t "frigate-xdna:release-${{ steps.tags.outputs.version }}" .

      - name: Pre-push sanity on local image (gate before any tag)
        # Same gate as post-push validation: a bad image must fail here,
        # before :latest (or any tag) can be published.
        run: |
          set -eu
          MANIFEST="$(sha256sum packaging/vendor-files.manifest.json | cut -d" " -f1)"
          CONTAINER_RUNTIME=docker bash tools/release_sanity.sh \
            "frigate-xdna:release-${{ steps.tags.outputs.version }}" \
            "$MANIFEST"

      - name: Record installed package inventory (finished image)
        run: |
          # The base digest is pinned but apt packages still float, so the
          # inventory describes the finished image — never the pristine
          # base. Honest name: pinned and auditable, not byte-reproducible.
          set -euo pipefail
          # Explicit entrypoint: the image ENTRYPOINTs fxdna, so a bare
          # command would run as `fxdna dpkg-query ...`.
          docker run --rm \
            --entrypoint /usr/bin/dpkg-query \
            "frigate-xdna:release-${{ steps.tags.outputs.version }}" \
            -W -f='${Package} ${Version} ${Architecture}\n' \
            | sort > release-out/base-packages.txt
          wc -l release-out/base-packages.txt

      - name: Generate SBOM + release manifest from release source
        run: |
          set -eu
          SHORT="$(git rev-parse --short HEAD)"
          python3 tools/gen_sbom.py \
            --out release-out/sbom.json \
            --image "$IMAGE" \
            --image-id "$SHORT"
          python3 - <<'EOF'
          import hashlib
          import json
          import os
          manifest = {
              "schema_version": 1,
              "image": os.environ["IMAGE"],
              "version": "${{ steps.tags.outputs.version }}",
              "tag": "${{ steps.tags.outputs.tag }}",
              "stable": "${{ steps.tags.outputs.stable }}" == "true",
              "source_sha": "${{ steps.source.outputs.sha }}",
              "vendor_bundle": json.load(
                  open("packaging/vendor-bundle.json"))["bundle"],
              "vendor_manifest_sha256": hashlib.sha256(
                  open("packaging/vendor-files.manifest.json", "rb").read()
              ).hexdigest(),
              "recipe_id": "bf16-vaiml-v1",
              "base_image": "ubuntu:24.04",
              "base_digest": "sha256:008173c23f95b170204355c12626cb5a965d779a7e1283b09e9cffbb1bf33ca3",
              "base_packages": "release-out/base-packages.txt",
              "built_at": os.environ["CREATED"],
              "builder": "github-hosted release runner",
          }
          manifest["source_short"] = manifest["source_sha"][:12]
          with open("release-out/release-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2, sort_keys=True)
          print(json.dumps(manifest, indent=2, sort_keys=True))
          EOF

      - name: Push pinned tags to GHCR
        id: push
        if: ${{ steps.tags.outputs.push == 'true' }}
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          DIGEST=""
          # shellcheck disable=SC2086
          for t in ${{ steps.tags.outputs.tags }}; do
            docker tag "frigate-xdna:release-${{ steps.tags.outputs.version }}" \
              "$IMAGE:$t"
            OUT="$(docker push "$IMAGE:$t" 2>&1)"
            echo "$OUT" | tail -2
            D="$(echo "$OUT" | grep -oE 'digest:[[:space:]]*sha256:[0-9a-f]+' | tail -1 | grep -oE 'sha256:[0-9a-f]+')"
            test -n "$D" || { echo "no digest in push output"; exit 1; }
            echo "pushed $IMAGE:$t -> $D"
            if [ -z "$DIGEST" ]; then
              DIGEST="$D"
            elif [ "$DIGEST" != "$D" ]; then
              echo "tags diverged across pushes: $DIGEST vs $D"
              exit 1
            fi
          done
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance + SBOM (OIDC)
        if: ${{ steps.tags.outputs.push == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      - name: Attest SBOM (OIDC)
        if: ${{ steps.tags.outputs.push == 'true' }}
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release-out/sbom.json
          push-to-registry: false

      - name: Upload release records (SBOM + manifest + inventory)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-records
          path: |
            release-out/sbom.json
            release-out/release-manifest.json
            release-out/base-packages.txt
          retention-days: 90

      - name: Cleanup (always)
        if: always()
        run: |
          rm -rf packaging/vendor-input release-out /tmp/vendor-bundle.tar.gz || true
          docker logout ghcr.io 2>/dev/null || true
      - name: Drop local release tag (pushed flow only; dry-run keeps it
          for the validate job)
        if: always() && steps.tags.outputs.push == 'true'
        run: |
          docker rmi "frigate-xdna:release-${{ steps.tags.outputs.version }}" 2>/dev/null || true

  release-validate:
    name: Pull-by-digest sanity (hardware-free)
    needs: release-build
    # Pushed flow only: each job runs on a fresh runner with no shared
    # image store, so dry runs cannot validate across jobs (the pre-push
    # gate in the build job already covers the local image instead).
    if: ${{ needs.release-build.result == 'success' && needs.release-build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-records
          path: release-out

      - name: Pull by digest into a clean environment
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE@${{ needs.release-build.outputs.digest }}"
          IMG="$IMAGE@${{ needs.release-build.outputs.digest }}"
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Hardware-free image checks (no NPU, no secrets)
        # Same gate as pre-push, now against the pulled-by-digest bytes.
        run: |
          set -eu
          MANIFEST="$(python3 -c "import json; print(json.load(open('release-out/release-manifest.json'))['vendor_manifest_sha256'])")"
          CONTAINER_RUNTIME=docker bash tools/release_sanity.sh \
            "${{ env.IMG }}" "$MANIFEST"

      - name: Cleanup (always)
        if: always()
        run: |
          docker logout ghcr.io 2>/dev/null || true
          docker rmi "${{ env.IMG }}" 2>/dev/null || true

  release-assets:
    name: Create GitHub Release with SBOM + manifest
    needs: [release-build, release-validate]
    if: ${{ github.ref_type == 'tag' && needs.release-build.outputs.pushed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-records
          path: release-out
      - name: Create release + attach SBOM + manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ls release-out/sbom.json release-out/release-manifest.json \
            release-out/base-packages.txt
          FLAGS=""
          if [ "${{ needs.release-build.outputs.stable }}" = "false" ]; then
            FLAGS="--prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "${{ github.ref_name }}" \
            --title "frigate-xdna ${{ github.ref_name }}" \
            --notes "Appliance image: ghcr.io/mitchins/frigate-xdna@${{ needs.release-build.outputs.digest }}. SBOM and release manifest attached; vendor payload, models and keys never leave the trusted builder. See docs/RELEASE.md." \
            $FLAGS \
            release-out/sbom.json release-out/release-manifest.json \
            release-out/base-packages.txt
